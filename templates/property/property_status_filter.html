<form method="get" class="property-status-filter">
    <input type="hidden" name="search" value="{{ search }}">

    <label for="status">Статус на офертата:</label>

    <select name="status" id="status" onchange="this.form.submit()">
        <option value="all" {% if status == 'all' %}selected{% endif %}>
            Всички
        </option>
        <option value="active" {% if status == 'active' %}selected{% endif %}>
            Активни
        </option>
        <option value="inactive" {% if status == 'inactive' %}selected{% endif %}>
            Неактивни
        </option>
    </select>
</form>
