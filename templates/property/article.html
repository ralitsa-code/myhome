<article class="property-card">
    {% if property.main_image %}
        <img src="{{ property.main_image.url }}">
    {% else %}
        <div class="property-image-list">No Image</div>
    {% endif %}
    <h2 class="property-title"> {{ property.get_property_type_display }}</h2>
    <p class="city">City: {{ property.neighborhood.city }} </p>
    <p class="neighborhood">Neighborhood: {{ property.neighborhood.name }}</p>
    <p class="area">Area: {{ property.area | floatformat }} sq. m.</p>

    <p class="price">{{ property.price | floatformat }} €</p>
    <a href="{% url 'property-details' property.id %}" class="btn">View Details</a>
</article>
