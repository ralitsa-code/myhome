{% extends 'base.html' %}


{% block title %}
    Create Feature | My Home
{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/error_message.css' %}">
{% endblock %}

{% block content %}
    <main>
        <section class="feature-form">
            <div>
                <p>
                    Enter the new feature in the field and click Save.
                </p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div>
                    {{ form.name }}
                    {{ form.name.errors }}
                </div>
                <button type="submit" class="button">
                    Save
                </button>
                <a href="{% url 'features-list' %}" class="cancel-button">
                    Cancel
                </a>
            </form>
        </section>
    </main>
{% endblock %}
