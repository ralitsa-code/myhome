{% extends 'base.html' %}


{% block title %}
    Edit Feature | My Home
{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
    <link rel="stylesheet" href="{% static 'css/error_message.css' %}">
{% endblock %}

{% block content %}
    <main>
        <section class="feature-form">
            <div>
                <h3>
                    Edit the feature and save your changes.
                </h3>
            </div>
            <form method="post">
                {% csrf_token %}
                <div>
                    {{ form.name }}
                    {{ form.name.errors }}
                </div>
                <button type="submit" class="button">
                    Save Changes
                </button>
            </form>
            <a href="{% url 'delete-feature' feature.pk %}" class="delete-button">
                Delete
            </a>
        </section>
    </main>
{% endblock %}
