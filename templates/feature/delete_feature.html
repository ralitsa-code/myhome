{% extends 'base.html' %}

{% block title %}
    Delete Feature | My Home
{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
{% endblock %}

{% block content %}
    <main>
        <section class="feature-form">
            <div>
                <h3>
                    Are you sure you want to delete this feature?
                </h3>
            </div>
            <form method="post">
                {{ form }}
                {% csrf_token %}
                <button class="delete-button">Yes, delete</button>
            </form>
            <a href="{% url 'features-list' %}" class="button">Cancel</a>
        </section>
    </main>
{% endblock %}
