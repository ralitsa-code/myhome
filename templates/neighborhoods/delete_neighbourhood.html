{% extends 'base.html' %}

{% block title %}
    Изтрий квартал | My Home
{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
{% endblock %}

{% block content %}
        <main>
            <section class="feature-form"> 
                <div>
                    <h2>
                         Наистина ли искате да изтриете този квартал?
                    </h2>
                </div>
                <form method="post" >
                    {% csrf_token %}
                    <a href="{% url 'delete-neighbourhood' neighbourhood_id %}" ><button class="delete-button" type="submit" >Да, изтрий</button></a>
                </form>
                <a href="{%  url 'neighbourhood-list' %}" class="button" > Не изтривай </a>
            </section>
        </main>
{% endblock %}
