{% extends 'base.html' %}

{% block title %}
    Cities | My Home
{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/list.css' %}">
{% endblock %}

{% block content %}
    <main>
        {% include 'search_form.html' %}
        <h3>Click a city to edit it.</h3>
        <section class="list-container">
            {% for city in cities %}
                <a href="{% url 'edit-city' city.id %}" class="list-item">
                    {{ city.name }}
                </a>
            {% endfor %}
        </section>
        <section class="edit-features">
            <a class="button" href="{% url 'create-city' %}">Add City</a>
        </section>
    </main>
{% endblock %}
